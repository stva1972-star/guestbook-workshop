services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: guestbook
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: guestbook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guestbook -d guestbook"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://guestbook:${DB_PASSWORD}@db:5432/guestbook
      GREETING: Добро пожаловать в гостевую книгу!
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: